<!DOCTYPE html>
<html>
<head>
    <title>🔍 Debug Sesión y Registro Fiscal</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .debug-section { margin: 20px 0; padding: 15px; border: 2px solid #007bff; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #28a745; }
        .error { background-color: #f8d7da; border-color: #dc3545; }
        .warning { background-color: #fff3cd; border-color: #ffc107; }
        .info { background-color: #d1ecf1; border-color: #17a2b8; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 300px; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .form-group { margin: 10px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 250px; }
    </style>
</head>
<body>
    <h1>🔍 Debug Sesión y Registro Fiscal</h1>
    
    <div class="debug-section info">
        <h3>1. Estado de la Sesión</h3>
        <button onclick="verificarSesion()">🔄 Verificar Estado de Sesión</button>
        <div id="sessionStatus"></div>
    </div>
    
    <div class="debug-section">
        <h3>2. Prueba de Registro Fiscal</h3>
        <form id="testFiscalForm">
            <div class="form-group">
                <label>RFC:</label>
                <input type="text" id="rfc_fiscal" value="ABC123456789" required>
            </div>
            
            <div class="form-group">
                <label>Nombre/Razón Social:</label>
                <input type="text" id="nombre_fiscal" value="EMPRESA DE PRUEBA SA DE CV" required>
            </div>
            
            <div class="form-group">
                <label>Régimen Fiscal:</label>
                <select id="regimen_fiscal" required>
                    <option value="">Cargar regímenes...</option>
                </select>
                <button type="button" onclick="cargarRegimenes()">🔄 Cargar</button>
            </div>
            
            <div class="form-group">
                <label>Código Postal:</label>
                <input type="text" id="cp_fiscal" value="01000" pattern="[0-9]{5}" required>
            </div>
            
            <button type="submit">💾 Probar Registro Fiscal</button>
        </form>
        
        <div id="fiscalResult"></div>
    </div>

    <script>
    // Verificar estado de sesión
    async function verificarSesion() {
        const statusDiv = document.getElementById('sessionStatus');
        statusDiv.innerHTML = '<p>🔄 Verificando sesión...</p>';
        
        try {
            const response = await fetch('core/debug-session.php');
            const data = await response.json();
            
            let html = '<div class="' + (data.usuario_logueado ? 'success' : 'warning') + '" style="margin-top: 10px; padding: 10px; border-radius: 4px;">';
            
            if (data.usuario_logueado) {
                html += '<h4>✅ Usuario Logueado</h4>';
                html += `<p><strong>ID:</strong> ${data.user_data.id_usuario}</p>`;
                html += `<p><strong>Correo:</strong> ${data.user_data.correo}</p>`;
                html += `<p><strong>Tiene Info Fiscal:</strong> ${data.tiene_info_fiscal ? 'Sí' : 'No'}</p>`;
            } else {
                html += '<h4>❌ Usuario NO Logueado</h4>';
                html += '<p>No se pudo identificar al usuario en la sesión.</p>';
            }
            
            html += '<details><summary>Ver datos completos</summary><pre>' + JSON.stringify(data, null, 2) + '</pre></details>';
            html += '</div>';
            
            statusDiv.innerHTML = html;
            
        } catch (error) {
            statusDiv.innerHTML = '<div class="error" style="margin-top: 10px; padding: 10px; border-radius: 4px;"><h4>❌ Error</h4><p>' + error.message + '</p></div>';
        }
    }
    
    // Cargar regímenes fiscales
    async function cargarRegimenes() {
        try {
            const response = await fetch('core/listar-regimen-fiscal.php');
            const data = await response.json();
            
            const select = document.getElementById('regimen_fiscal');
            select.innerHTML = '<option value="">Seleccionar...</option>';
            
            if (data.success && data.regimenes) {
                data.regimenes.forEach(regimen => {
                    const option = document.createElement('option');
                    option.value = regimen.codigo;
                    option.textContent = `${regimen.codigo} - ${regimen.descripcion}`;
                    select.appendChild(option);
                });
                console.log('✅ Regímenes cargados:', data.regimenes.length);
            }
        } catch (error) {
            console.error('Error cargando regímenes:', error);
        }
    }
    
    // Probar registro fiscal
    document.getElementById('testFiscalForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            rfc_fiscal: document.getElementById('rfc_fiscal').value,
            nombre_fiscal: document.getElementById('nombre_fiscal').value,
            regimen_fiscal: document.getElementById('regimen_fiscal').value,
            cp_fiscal: document.getElementById('cp_fiscal').value
        };
        
        const resultDiv = document.getElementById('fiscalResult');
        resultDiv.innerHTML = '<div class="info" style="margin-top: 10px; padding: 10px; border-radius: 4px;"><p>🔄 Registrando información fiscal...</p></div>';
        
        try {
            const response = await fetch('core/registro-info-fiscal.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });
            
            const result = await response.json();
            
            let html = '<div class="' + (result.success ? 'success' : 'error') + '" style="margin-top: 10px; padding: 10px; border-radius: 4px;">';
            html += '<h4>' + (result.success ? '✅ Éxito' : '❌ Error') + '</h4>';
            html += '<p>' + result.message + '</p>';
            html += '<details><summary>Ver respuesta completa</summary><pre>' + JSON.stringify(result, null, 2) + '</pre></details>';
            html += '</div>';
            
            resultDiv.innerHTML = html;
            
            // Si fue exitoso, actualizar el estado de sesión
            if (result.success) {
                setTimeout(verificarSesion, 1000);
            }
            
        } catch (error) {
            resultDiv.innerHTML = '<div class="error" style="margin-top: 10px; padding: 10px; border-radius: 4px;"><h4>❌ Error de Red</h4><p>' + error.message + '</p></div>';
        }
    });
    
    // Cargar datos iniciales
    document.addEventListener('DOMContentLoaded', function() {
        verificarSesion();
        cargarRegimenes();
    });
    </script>
</body>
</html>
