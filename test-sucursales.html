<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sucursales - API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Test API: Obtener Sucursales</h3>
                    </div>
                    <div class="card-body">
                        <p>Este archivo prueba si la API de sucursales está funcionando correctamente.</p>
                        
                        <button class="btn btn-primary btn-lg w-100 mb-3" onclick="testearAPI()">
                            🧪 Probar API
                        </button>

                        <hr>

                        <h5>Resultados:</h5>
                        <pre id="resultados" class="bg-light p-3 rounded border">
Esperando prueba...
                        </pre>

                        <h5 class="mt-4">Detalles de Sesión:</h5>
                        <div id="sesion" class="bg-light p-3 rounded border">
                            <small id="sesionTexto">Cargando...</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function testearAPI() {
            const resultados = document.getElementById('resultados');
            resultados.textContent = 'Probando API...';

            // Probar obtener sucursales
            fetch('./core/obtener-sucursales-cliente.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(response => {
                console.log('Status:', response.status);
                console.log('Content-Type:', response.headers.get('content-type'));
                return response.text(); // Primero obtener como texto
            })
            .then(text => {
                console.log('Response Text:', text);
                resultados.textContent = 'Respuesta (RAW):\n' + text;
                
                // Intentar parsear JSON
                try {
                    const data = JSON.parse(text);
                    resultados.textContent = 'Respuesta (JSON):\n' + JSON.stringify(data, null, 2);
                    
                    if (data.success && data.sucursales) {
                        resultados.textContent += '\n\n✅ API FUNCIONA CORRECTAMENTE\n';
                        resultados.textContent += 'Sucursales encontradas: ' + data.sucursales.length;
                        
                        data.sucursales.forEach((suc, idx) => {
                            resultados.textContent += `\n\n${idx + 1}. ${suc.nombre}`;
                            resultados.textContent += `\n   ID: ${suc.id_empresa}`;
                            resultados.textContent += `\n   Código: ${suc.codigo_suc}`;
                        });
                    } else {
                        resultados.textContent += '\n\n⚠️ API respondió pero sin datos';
                        resultados.textContent += '\nMensaje: ' + (data.message || 'Sin mensaje');
                    }
                } catch(e) {
                    resultados.textContent += '\n\n❌ Error al parsear JSON: ' + e.message;
                }
            })
            .catch(error => {
                resultados.textContent = '❌ Error en la solicitud:\n' + error.message;
                console.error('Error:', error);
            });
        }

        // Cargar información de sesión
        window.addEventListener('load', function() {
            const sesionTexto = document.getElementById('sesionTexto');
            const cookies = document.cookie;
            sesionTexto.textContent = 'Cookies: ' + (cookies ? cookies : 'Sin cookies') + '\n\nURL actual: ' + window.location.href;
        });
    </script>
</body>
</html>
